# PDF-Theme für das "Das Netzwerk"-Handbuch
# Basiert auf dem default-theme von asciidoctor-pdf

extends: default

page:
  layout: portrait
  margin: [2cm, 2cm, 2cm, 2cm]
  size: A4

base:
  font-size: 11
  line-height-length: 15
  line-height: $base-line-height-length / $base-font-size

heading:
  font-color: #222222
  h1:
    font-size: 26
  h2:
    font-size: 19
  h3:
    font-size: 15

title-page:
  align: center
  title:
    font-size: 30
    font-style: bold
    top: 40%
  subtitle:
    font-size: 15
    font-style: italic
  authors:
    font-size: 12
    margin-top: 20

prose:
  margin-bottom: 6

code:
  font-family: Courier
  font-size: 9.5
  background-color: #f4f4f4
  border-color: #cccccc

quote:
  font-style: italic
  border-left-width: 3
  border-color: #999999
  padding: [0, 0, 0, 12]

footer:
  font-size: 8
  height: 1.5cm
  # Seitenzahl außen, wie im Buchsatz üblich. Die leeren Felder müssen
  # ausdrücklich dastehen: was hier fehlt, erbt Asciidoctor-PDF aus seiner
  # Voreinstellung, und dann steht die Zahl zweimal auf der Seite.
  recto:
    left:
      content: ''
    center:
      content: ''
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'
    center:
      content: ''
    right:
      content: ''
